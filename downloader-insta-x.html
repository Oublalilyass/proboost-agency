  const th=$("thumb");th.style.display=d.thumbnail?"block":"none";th.src=d.thumbnail||"";
  const box=$("vars");box.textContent="";
  d.variants.forEach(v=>{
    const row=el("div",null,{className:"var"}),s=el("span",v.quality);
    if(v.size)s.appendChild(el("small","MP4 · "+v.size));
    const a=el("a",M.save,{href:v.url,target:"_blank",rel:"noopener"});a.setAttribute("download","");
    if(/video\.twimg\.com/.test(v.url)){
      a.addEventListener("click",async e=>{
        e.preventDefault();const lb=a.textContent;a.textContent="…";
        try{const r=await fetch(v.url);if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob());
          const l=el("a",null,{href:u,download:"video-"+v.quality+".mp4"});document.body.appendChild(l);l.click();l.remove();
          setTimeout(()=>URL.revokeObjectURL(u),10000)}
        catch(err){window.open(v.url,"_blank","noopener")}
        a.textContent=lb;
      });
    }
    row.append(s,a);box.appendChild(row);
  });
  $("result").classList.add("on");
}
paint();
</script>
