        try{const r=await fetch(v.url);if(!r.ok)throw 0;const u=URL.createObjectURL(await r.blob());
          const l=el("a",null,{href:u,download:"tiktok-"+v.quality.replace(/\W+/g,"-")+(v.audio?".mp3":".mp4")});document.body.appendChild(l);l.click();l.remove();
          setTimeout(()=>URL.revokeObjectURL(u),10000)}
        catch(err){window.open(v.url,"_blank","noopener")}
        a.textContent=lb;
      });
    }
    row.append(s,a);box.appendChild(row);
  });
  $("result").classList.add("on");
}
paint();
</script>
